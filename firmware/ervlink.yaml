# The author's ERV link board: Thread. Paste into the ESPHome Device Builder (or copy and
# change the name); everything else comes from the package. Secrets in its secrets.yaml:
#   thread_tlv        HA: Settings > Devices & services > Thread > (your network) >
#                     the (i) button > "Active dataset TLVs"
#   ervlink_api_key   32-byte base64 key; also encrypts OTA uploads
# To update, change the @fw-vNN at the end of the package line and install.

substitutions:
  name: ervlink
  friendly_name: ERV link

packages:
  ervlink: github://lukewaite/panasonic-intellibalance-esphome/firmware/ervlink-package.yaml@fw-v16

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret ervlink_api_key

network:
  enable_ipv6: true

openthread:
  tlv: !secret thread_tlv
