# ervlink — firmware for the rev A inline interface board.
#
# Reads both lines of the ERV <-> wall control link through the comparator taps and
# publishes every register to Home Assistant. The relay stays in hardware passthrough
# except for two short, button-triggered intercepts (v5):
#   "Intercept test"  ~1 s: sends the wall control's idle "no change" frames to the ERV.
#   "Turn on"         ~1.4 s: sends the turn-on snapshot the wall control sends, with the
#                     last airflow/ASHRAE settings seen while on, then idle frames.
# Neither forwards anything: during the intercept the ERV hears only the ESP and the wall
# control hears nothing (its TXD input is held at the 0 V idle level).
#
#   RXD line = wall control -> ERV (commands), tapped on GPIO1, UART1, driven via GPIO10/Q2
#   TXD line = ERV -> wall control (state),    tapped on GPIO0, UART0, driven via GPIO3/Q3
#
# The comparators invert, so each UART is a plain idle-high 4800 8E1 receiver; Q2/Q3
# invert again, so each UART is also a plain idle-high transmitter. Both taps sit on the
# sending end of their line, so they keep reading live traffic while intercepting.
# GPIO11 (relay) is driven low at boot. SW1 in PASS overrides it in hardware.
#
# Frame: 02 | A1 A0 | D7..D0 | 03 | BCC, ASCII hex, BCC = ~(XOR of A1..ETX).
# The 8 data chars are 4 bytes, each sent LOW NIBBLE FIRST: "3103F0B4" = 13 30 0F 4B.
# Decoded entities follow the 2026-10-29 button session (CLAUDE.md "Register map");
# the raw hex sensors stay as ground truth.
# Health check: frame rates should sit near 25/s (RXD) and 19/s (TXD) with zero bad
# frames. Anything else means the tap or the UART settings are wrong, not a noisy bus.
#
# Self-contained on purpose: paste it into the ESPHome dashboard as-is.
# Secrets needed in the dashboard's secrets.yaml:
#   thread_tlv        HA: Settings > Devices & services > Thread > (your network) >
#                     the (i) button > "Active dataset TLVs"
#   ervlink_api_key   32-byte base64 key; also encrypts OTA uploads

esphome:
  name: ervlink
  friendly_name: ERV link
  on_boot:
    priority: 800
    then:
      - output.turn_off: relay
      - binary_sensor.template.publish: {id: intercepting, state: false}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

network:
  enable_ipv6: true

openthread:
  tlv: !secret thread_tlv

api:
  encryption:
    key: !secret ervlink_api_key

# OTA reuses the API key (bare `encryption:` inherits it); no separate password.
ota:
  - platform: esphome
    encryption: {}

# Relay coil driver (Q1). High = intercept. Only the interval lambda below switches it.
output:
  - platform: gpio
    id: relay
    pin: GPIO11

uart:
  # tx_buffer_size makes writes non-blocking: one cycle of 5 frames is 65 bytes.
  - id: uart_rxd
    rx_pin: GPIO1
    tx_pin: GPIO10
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 512
    tx_buffer_size: 256
  # TX is configured only so the pin idles high (Q3 on, wall control input at 0 V).
  - id: uart_txd
    rx_pin: GPIO0
    tx_pin: GPIO3
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 512

globals:
  - {id: rxd_frames, type: uint32_t, initial_value: "0"}
  - {id: rxd_bad, type: uint32_t, initial_value: "0"}
  - {id: rxd_junk, type: uint32_t, initial_value: "0"}
  - {id: txd_frames, type: uint32_t, initial_value: "0"}
  - {id: txd_bad, type: uint32_t, initial_value: "0"}
  - {id: txd_junk, type: uint32_t, initial_value: "0"}
  # Intercept request from a button: 1 = test (idle frames only), 2 = turn on.
  - {id: intercept_req, type: uint8_t, initial_value: "0"}
  # Settings for "Turn on", saved while the ERV runs steadily without boost. Defaults are
  # the 2026-10-29 settings: 120/120 CFM (code 7), ASHRAE 30 min/h.
  - {id: saved_supply, type: uint8_t, restore_value: true, initial_value: "7"}
  - {id: saved_exhaust, type: uint8_t, restore_value: true, initial_value: "7"}
  - {id: saved_ashrae, type: uint8_t, restore_value: true, initial_value: "3"}

interval:
  # One frame is 13 bytes x 2.29 ms; the 512-byte buffers hold ~1 s. Normally this runs
  # once per main loop (~16 ms). During an intercept the loop runs continuously, so frame
  # ends and the relay timing are seen to within a few ms.
  - interval: 1ms
    then:
      - lambda: |-
          struct Line {
            const char *name;
            uart::UARTComponent *uart;
            uint32_t *frames, *bad, *junk;
            uint8_t buf[13];
            uint8_t len;
            char last[3];       // address of the last good frame
            uint32_t last_end;  // millis() when it completed
          };
          static Line lines[2] = {
            {"RXD", id(uart_rxd), &id(rxd_frames), &id(rxd_bad), &id(rxd_junk), {}, 0, "", 0},
            {"TXD", id(uart_txd), &id(txd_frames), &id(txd_bad), &id(txd_junk), {}, 0, "", 0},
          };
          // Latest decoded state, for "Turn on" and for saving its settings.
          static bool on = false, boosting = false;
          static uint8_t cur_supply = 0, cur_exhaust = 0, cur_ashrae = 0;
          static uint32_t settled_since = 0;
          // B1 is only meaningful with air moving: while off, the sensors drift to the air
          // sitting in the unit (2026-10-30: "outside" 16 °C with 8 °C outside).
          static bool power_known = false, b1_dirty = false, b1_shown = false;
          static uint32_t on_since = 0;
          static uint8_t b1[4];

          auto dump = [](const uint8_t *b, size_t n) {
            std::string s;
            char h[4];
            for (size_t i = 0; i < n; i++) { snprintf(h, sizeof h, "%02X ", b[i]); s += h; }
            return s;
          };
          auto is_hex = [](uint8_t c) { return (c >= '0' && c <= '9') || (c >= 'A' && c <= 'F'); };
          auto hexval = [](char c) -> uint8_t { return c <= '9' ? c - '0' : c - 'A' + 10; };

          auto reg_sensor = [&](const std::string &a) -> text_sensor::TextSensor * {
            if (a == "00") return id(reg_rxd_00);
            if (a == "10") return id(reg_rxd_10);
            if (a == "20") return id(reg_rxd_20);
            if (a == "30") return id(reg_rxd_30);
            if (a == "F0") return id(reg_rxd_f0);
            if (a == "01") return id(reg_txd_01);
            if (a == "11") return id(reg_txd_11);
            if (a == "21") return id(reg_txd_21);
            if (a == "31") return id(reg_txd_31);
            if (a == "A1") return id(reg_txd_a1);
            if (a == "B1") return id(reg_txd_b1);
            if (a == "F1") return id(reg_txd_f1);
            return nullptr;
          };

          auto handle = [&](Line &L) {
            const uint8_t *f = L.buf;
            bool ok = f[11] == 0x03;
            uint8_t x = 0;
            for (int i = 1; i <= 11; i++) {
              if (i <= 10 && !is_hex(f[i])) ok = false;
              x ^= f[i];
            }
            if (!ok || (uint8_t) ~x != f[12]) {
              (*L.bad)++;
              ESP_LOGW("ervlink", "%s bad frame (%s): %s", L.name,
                       ok ? "BCC" : "format", dump(f, 13).c_str());
              return;
            }
            (*L.frames)++;
            L.last[0] = f[1]; L.last[1] = f[2]; L.last[2] = 0;
            L.last_end = millis();
            std::string addr((const char *) f + 1, 2), data((const char *) f + 3, 8);
            // Low address nibble encodes direction: 0 on RXD, 1 on TXD.
            char want = (L.name[0] == 'R') ? '0' : '1';
            auto *s = addr[1] == want ? reg_sensor(addr) : nullptr;
            if (s == nullptr) {
              // Remember the last value per line+address so a few interleaved unknown
              // registers are each reported once per change, not on every frame.
              static std::map<std::string, std::string> seen;
              std::string key = std::string(L.name) + " " + addr;
              if (seen[key] != data) {
                seen[key] = data;
                ESP_LOGW("ervlink", "unexpected register: %s %s", key.c_str(), data.c_str());
                id(reg_unknown).publish_state(key + " " + data);
              }
              return;
            }
            if (s->state == data) return;
            ESP_LOGI("ervlink", "%s %s: %s -> %s", L.name, addr.c_str(),
                     s->state.empty() ? "(none)" : s->state.c_str(), data.c_str());
            s->publish_state(data);

            // Byte k is chars 2k (low nibble) and 2k+1 (high nibble).
            uint8_t b[4];
            for (int k = 0; k < 4; k++) b[k] = hexval(data[2 * k]) | hexval(data[2 * k + 1]) << 4;
            // Airflow code: 50 + 10 x v up to 13 (180 CFM); the menu then jumps to 200,
            // which is code 16. 14 and 15 have never been seen.
            auto cfm = [](uint8_t v) { return v <= 13 ? 50.0f + 10.0f * v : v == 16 ? 200.0f : NAN; };
            // While off the ERV zeroes 01 and 11, so their values mean nothing then.
            settled_since = millis();
            if (addr == "01") {
              // A unit already running at boot counts as settled.
              if (b[0] && !on) on_since = power_known ? millis() : millis() - 300000;
              power_known = true;
              on = b[0] != 0;
              cur_supply = b[1];
              cur_exhaust = b[2];
              id(erv_power).publish_state(on);
              id(airflow_supply).publish_state(on ? cfm(b[1]) : NAN);
              id(airflow_exhaust).publish_state(on ? cfm(b[2]) : NAN);
              if (!on) id(ashrae).publish_state(NAN);
            } else if (addr == "11") {
              cur_ashrae = b[0];
              id(ashrae).publish_state(on ? 10.0f * b[0] : NAN);
              id(boost_duration).publish_state(b[1] ? 10.0f * b[1] : NAN);
            } else if (addr == "21") {
              boosting = b[0] != 0;
              id(boost).publish_state(boosting);
            } else if (addr == "B1") {
              memcpy(b1, b, 4);
              b1_dirty = true;
            }
          };

          for (auto &L : lines) {
            uint8_t c;
            while (L.uart->available() && L.uart->read_byte(&c)) {
              if (L.len == 0) {
                if (c == 0x02) L.buf[L.len++] = c;
                else (*L.junk)++;
                continue;
              }
              // Bytes 1..11 are ASCII hex or ETX, never STX, so an STX there means the
              // previous frame was cut short: count it and resync. Byte 12 (BCC) can be 02.
              if (c == 0x02 && L.len < 12) {
                (*L.bad)++;
                ESP_LOGW("ervlink", "%s truncated frame: %s", L.name, dump(L.buf, L.len).c_str());
                L.len = 1;
                continue;
              }
              L.buf[L.len++] = c;
              if (L.len == 13) {
                handle(L);
                L.len = 0;
              }
            }
          }

          uint32_t now = millis();

          // Publish B1 once the ERV has run for 5 min; unavailable while off or settling.
          bool b1_ok = on && now - on_since > 300000;
          if (b1_ok != b1_shown || (b1_ok && b1_dirty)) {
            id(inside_temp).publish_state(b1_ok ? (int8_t) b1[0] : NAN);
            id(inside_rh).publish_state(b1_ok ? b1[1] : NAN);
            id(outside_temp).publish_state(b1_ok ? (int8_t) b1[2] : NAN);
            id(outside_rh).publish_state(b1_ok ? b1[3] : NAN);
            b1_shown = b1_ok;
            b1_dirty = false;
          }

          // Save the settings for "Turn on" once 01/11/21 have been unchanged for 5 s with
          // the ERV on and not boosting (boost reports 200/200 in 01, which isn't a setting).
          auto valid = [](uint8_t v) { return (v >= 1 && v <= 13) || v == 16; };
          if (on && !boosting && now - settled_since > 5000 && valid(cur_supply) &&
              valid(cur_exhaust) && cur_ashrae >= 1 && cur_ashrae <= 6 &&
              (cur_supply != id(saved_supply) || cur_exhaust != id(saved_exhaust) ||
               cur_ashrae != id(saved_ashrae))) {
            id(saved_supply) = cur_supply;
            id(saved_exhaust) = cur_exhaust;
            id(saved_ashrae) = cur_ashrae;
            ESP_LOGI("ervlink", "saved settings for Turn on: supply %u, exhaust %u, ASHRAE %u",
                     cur_supply, cur_exhaust, cur_ashrae);
          }

          // ---- Intercept ----
          // The wall control sends its 5 RXD frames back to back (~150 ms) every 200 ms,
          // then leaves a ~51 ms gap; the ERV's TXD cycle ends in a ~81 ms gap (longer after
          // F1). The relay switches both lines at once and needs a few ms, so it switches
          // only inside a gap, judged from when the last cycle's final frame completed. UART
          // receive latency (a few ms) is covered by the 20 ms margin.
          enum Phase { IDLE, WAIT_IN, ACTIVE, WAIT_OUT };
          static Phase phase = IDLE;
          static HighFrequencyLoopRequester fast;
          static uint8_t kind = 0, cycles = 0, sent = 0;
          static uint32_t t_req = 0, t_next = 0, t_rx00 = 0, t_on = 0;

          auto gap_left = [&](Line &L, std::initializer_list<const char *> ends, int gap) {
            if (L.len != 0 || L.uart->available()) return -1;
            for (auto *e : ends)
              if (strcmp(L.last, e) == 0) return gap - (int) (now - L.last_end);
            return -1;
          };
          int rx_left = gap_left(lines[0], {"F0"}, 51);
          int tx_left = gap_left(lines[1], {"31", "F1"}, 81);
          // The wall control's cycle start, from its 00 frame (30 ms long).
          if (strcmp(lines[0].last, "00") == 0) t_rx00 = lines[0].last_end - 30;

          auto set_relay = [&](bool v) {
            if (v) id(relay).turn_on(); else id(relay).turn_off();
            id(intercepting).publish_state(v);
          };
          // One RXD frame: STX, address, 4 bytes as 8 hex chars low nibble first, ETX, BCC.
          auto frame = [](std::vector<uint8_t> &out, const char *addr, const uint8_t *v) {
            static const char hex[] = "0123456789ABCDEF";
            size_t start = out.size();
            out.push_back(0x02);
            out.push_back(addr[0]);
            out.push_back(addr[1]);
            for (int k = 0; k < 4; k++) { out.push_back(hex[v[k] & 0xF]); out.push_back(hex[v[k] >> 4]); }
            out.push_back(0x03);
            uint8_t bcc = 0;
            for (size_t i = start + 1; i < out.size(); i++) bcc ^= out[i];
            out.push_back((uint8_t) ~bcc);
          };

          if (phase == IDLE && id(intercept_req)) {
            kind = id(intercept_req);
            id(intercept_req) = 0;
            bool fresh = now - lines[1].last_end < 1000 && now - lines[0].last_end < 1000;
            if (!fresh) {
              ESP_LOGW("ervlink", "intercept refused: no live traffic on both lines");
            } else if (kind == 2 && on) {
              ESP_LOGW("ervlink", "Turn on refused: the ERV is already on");
            } else {
              // Turn on: 3 cycles of the snapshot (the wall control holds each command for 3),
              // then 2 idle. Test: 3 idle cycles.
              cycles = kind == 2 ? 5 : 3;
              sent = 0;
              t_req = now;
              phase = WAIT_IN;
              fast.start();
              ESP_LOGI("ervlink", "%s: waiting for a gap on both lines",
                       kind == 2 ? "Turn on" : "Intercept test");
            }
          }

          if (phase == WAIT_IN) {
            // Prefer a gap on both lines. They drift through each other over ~400 s and a
            // shared gap can be missing for a few minutes, so after 30 s settle for an RXD gap
            // only: the ERV still gets clean frames, the wall control may get one cut-off
            // state frame (it fails BCC).
            bool shared = rx_left >= 20 && tx_left >= 20;
            bool late = now - t_req > 30000;
            if (shared || (late && rx_left >= 20)) {
              set_relay(true);
              t_on = now;
              // Continue the wall control's cadence: the next cycle would start 200 ms after
              // the last one.
              t_next = t_rx00 + 200;
              while ((int32_t) (t_next - now) < 15) t_next += 200;
              phase = ACTIVE;
              ESP_LOGI("ervlink", "relay in (RXD gap %d ms, TXD gap %d ms left)", rx_left, tx_left);
            } else if (now - t_req > 60000) {
              phase = IDLE;
              fast.stop();
              ESP_LOGW("ervlink", "intercept abandoned: no RXD gap found in 60 s");
            }
          }

          if (phase == ACTIVE && sent == cycles) {
            // The last cycle started at t_next - 200 and takes ~150 ms to send.
            if ((int32_t) (now - (t_next - 200 + 160)) >= 0) phase = WAIT_OUT;
          } else if (phase == ACTIVE && (int32_t) (now - t_next) >= 0) {
            {
              const uint8_t idle00[4] = {0xFF, 0xFF, 0xFF, 0}, idle10[4] = {0xFF, 0xFF, 0, 0},
                            idle20[4] = {0xFF, 0, 0, 0}, zero[4] = {0, 0, 0, 0};
              const uint8_t on00[4] = {1, id(saved_supply), id(saved_exhaust), 0},
                            on10[4] = {id(saved_ashrae), 0xFF, 0, 0};
              bool cmd = kind == 2 && sent < 3;
              std::vector<uint8_t> out;
              frame(out, "00", cmd ? on00 : idle00);
              frame(out, "10", cmd ? on10 : idle10);
              frame(out, "20", cmd ? zero : idle20);
              frame(out, "30", zero);
              frame(out, "F0", zero);
              id(uart_rxd).write_array(out.data(), out.size());
              if (sent == 0 && cmd)
                ESP_LOGI("ervlink", "sending Turn on: supply %u, exhaust %u, ASHRAE %u",
                         id(saved_supply), id(saved_exhaust), id(saved_ashrae));
              sent++;
              t_next += 200;
            }
          }

          if (phase == WAIT_OUT) {
            // Our cycles kept the wall control's phase, so its RXD gap lines up with ours and
            // this is normally true at once. Waiting longer wouldn't find a TXD gap either:
            // the two lines' phase barely moves in a second.
            if (rx_left >= 20 || now - t_on > 4000) {
              set_relay(false);
              phase = IDLE;
              fast.stop();
              ESP_LOGI("ervlink", "relay out after %u ms (RXD gap %d ms, TXD gap %d ms left)",
                       (unsigned) (now - t_on), rx_left, tx_left);
            }
          }

          // Last resort: never hold the link for more than 5 s.
          if (phase != IDLE && phase != WAIT_IN && now - t_on > 5000) {
            set_relay(false);
            phase = IDLE;
            fast.stop();
            ESP_LOGE("ervlink", "intercept timed out; relay forced out");
          }

button:
  - platform: template
    name: "Turn on"
    icon: "mdi:power"
    on_press:
      - lambda: id(intercept_req) = 2;
  - platform: template
    name: "Intercept test"
    icon: "mdi:swap-horizontal"
    entity_category: diagnostic
    on_press:
      - lambda: id(intercept_req) = 1;

text_sensor:
  - {platform: template, id: reg_rxd_00, name: "RXD 00", icon: "mdi:arrow-right-bold", entity_category: diagnostic}
  - {platform: template, id: reg_rxd_10, name: "RXD 10", icon: "mdi:arrow-right-bold", entity_category: diagnostic}
  - {platform: template, id: reg_rxd_20, name: "RXD 20", icon: "mdi:arrow-right-bold", entity_category: diagnostic}
  - {platform: template, id: reg_rxd_30, name: "RXD 30", icon: "mdi:arrow-right-bold", entity_category: diagnostic}
  - {platform: template, id: reg_rxd_f0, name: "RXD F0", icon: "mdi:arrow-right-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_01, name: "TXD 01", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_11, name: "TXD 11", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_21, name: "TXD 21", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_31, name: "TXD 31", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_a1, name: "TXD A1", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_b1, name: "TXD B1", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - {platform: template, id: reg_txd_f1, name: "TXD F1", icon: "mdi:arrow-left-bold", entity_category: diagnostic}
  - platform: template
    id: reg_unknown
    name: "Unexpected register"
    entity_category: diagnostic

binary_sensor:
  # TXD 01 byte 0: 0 when off, 1 when on.
  - {platform: template, id: erv_power, name: "Power", device_class: running}
  # TXD 21 byte 0: 1 while boost runs. The ERV times boost itself and restores airflow.
  - {platform: template, id: boost, name: "Boost", device_class: running}
  # Relay state: on while the board drives the ERV instead of the wall control.
  - {platform: template, id: intercepting, name: "Intercepting", entity_category: diagnostic}

sensor:
  # TXD 01 bytes 1/2: supply, exhaust (confirmed 2026-10-29 by setting them apart).
  - {platform: template, id: airflow_supply, name: "Supply airflow", unit_of_measurement: "CFM", state_class: measurement, accuracy_decimals: 0, update_interval: never}
  - {platform: template, id: airflow_exhaust, name: "Exhaust airflow", unit_of_measurement: "CFM", state_class: measurement, accuracy_decimals: 0, update_interval: never}
  # TXD 11 byte 0: ASHRAE run time in tens of minutes per hour. Byte 1: the selected boost
  # length in tens of minutes, non-zero only while boost runs (not time remaining).
  - {platform: template, id: ashrae, name: "ASHRAE run time", unit_of_measurement: "min/h", accuracy_decimals: 0, update_interval: never}
  - {platform: template, id: boost_duration, name: "Boost duration", device_class: duration, unit_of_measurement: "min", accuracy_decimals: 0, update_interval: never}
  # TXD B1: inside temp, inside RH, outside temp, outside RH (all confirmed against the
  # display). Temps assumed signed for sub-zero readings; not yet seen. Unavailable while
  # the ERV is off and for 5 min after it starts (no airflow, so they read the unit).
  - {platform: template, id: inside_temp, name: "Inside temperature", device_class: temperature, unit_of_measurement: "°C", state_class: measurement, accuracy_decimals: 0, update_interval: never}
  - {platform: template, id: inside_rh, name: "Inside humidity", device_class: humidity, unit_of_measurement: "%", state_class: measurement, accuracy_decimals: 0, update_interval: never}
  - {platform: template, id: outside_temp, name: "Outside temperature", device_class: temperature, unit_of_measurement: "°C", state_class: measurement, accuracy_decimals: 0, update_interval: never}
  - {platform: template, id: outside_rh, name: "Outside humidity", device_class: humidity, unit_of_measurement: "%", state_class: measurement, accuracy_decimals: 0, update_interval: never}

  - platform: template
    name: "RXD frame rate"
    unit_of_measurement: "frames/s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      static uint32_t n0 = 0, t0 = 0;
      uint32_t n = id(rxd_frames), t = millis();
      float r = t0 ? (n - n0) * 1000.0f / (t - t0) : NAN;
      n0 = n; t0 = t;
      return r;
  - platform: template
    name: "TXD frame rate"
    unit_of_measurement: "frames/s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      static uint32_t n0 = 0, t0 = 0;
